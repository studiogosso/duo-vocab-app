<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DUO 3.0 単語帳</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--surface:#141928;--card:#1a2035;--card2:#212840;
  --text:#e8eaf0;--text2:#8892a8;--accent:#4a9eff;--accent2:#6c5ce7;
  --green:#00d2a0;--orange:#ff9f43;--red:#ff6b6b;--gold:#ffd700;
  --border:#2a3050;--radius:12px;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
a{color:var(--accent);text-decoration:none}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(10,14,26,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.header h1{font-size:18px;font-weight:700;flex:1}
.header h1 span{color:var(--accent);font-size:13px;font-weight:400;margin-left:8px}
.header-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;transition:.2s}
.header-btn:hover{background:var(--card2);border-color:var(--accent)}
.header-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Stats bar */
.stats-bar{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:100px;text-align:center;flex-shrink:0}
.stat-card .num{font-size:22px;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:11px;color:var(--text2);margin-top:2px}

/* Tabs */
.tabs{display:flex;padding:0 16px;gap:4px;border-bottom:1px solid var(--border)}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Section nav */
.section-nav{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.section-btn{background:var(--card);border:1px solid var(--border);color:var(--text2);padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.2s;flex-shrink:0}
.section-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.section-btn .progress-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px}
.section-btn .progress-dot.mastered{background:var(--green)}
.section-btn .progress-dot.learning{background:var(--orange)}

/* Content area */
.content{padding:16px;max-width:800px;margin:0 auto}

/* Sentence card */
.sentence-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;transition:.3s}
.sentence-card.mastered{border-color:var(--green)}
.sentence-header{display:flex;align-items:center;padding:14px 16px;gap:10px;cursor:pointer}
.sentence-num{background:var(--accent);color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.sentence-card.mastered .sentence-num{background:var(--green)}
.sentence-en{font-size:15px;line-height:1.5;flex:1;color:var(--text)}
.sentence-expand{color:var(--text2);font-size:18px;transition:.3s;flex-shrink:0}
.sentence-card.open .sentence-expand{transform:rotate(180deg)}
.sentence-body{display:none;border-top:1px solid var(--border)}
.sentence-card.open .sentence-body{display:block}
.sentence-ja{padding:12px 16px;background:rgba(74,158,255,.05);font-size:14px;color:var(--accent);line-height:1.6;border-bottom:1px solid var(--border)}

/* Word list */
.word-list{padding:8px 0}
.word-item{padding:10px 16px;border-bottom:1px solid rgba(42,48,80,.5);cursor:pointer;transition:.15s}
.word-item:last-child{border-bottom:none}
.word-item:hover{background:rgba(74,158,255,.05)}
.word-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.word-en{font-size:15px;font-weight:600;color:var(--text)}
.word-phonetic{font-size:12px;color:var(--text2);font-style:italic}
.word-pos{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--accent2);color:#fff}
.word-meanings{margin-top:6px;font-size:13px;color:var(--text);line-height:1.6}
.word-related{margin-top:4px;font-size:12px;color:var(--text2);line-height:1.5}
.word-status{display:flex;gap:6px;margin-top:8px}
.word-status-btn{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:.2s}
.word-status-btn:hover{border-color:var(--accent)}
.word-status-btn.known{background:var(--green);color:#fff;border-color:var(--green)}
.word-status-btn.learning{background:var(--orange);color:#fff;border-color:var(--orange)}

/* Flashcard mode */
.flashcard-container{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 0}
.flashcard{background:var(--card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:500px;min-height:280px;padding:30px 24px;text-align:center;cursor:pointer;transition:.3s;position:relative;perspective:1000px}
.flashcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 30px rgba(74,158,255,.15)}
.flashcard-num{position:absolute;top:14px;left:18px;font-size:12px;color:var(--text2);font-weight:600}
.flashcard-section{position:absolute;top:14px;right:18px;font-size:11px;color:var(--accent);font-weight:600}
.flashcard-en{font-size:20px;line-height:1.6;margin-top:20px;color:var(--text)}
.flashcard-divider{width:60px;height:2px;background:var(--accent);margin:20px auto;opacity:0;transition:.3s}
.flashcard.revealed .flashcard-divider{opacity:1}
.flashcard-ja{font-size:16px;color:var(--accent);line-height:1.6;opacity:0;transform:translateY(10px);transition:.3s}
.flashcard.revealed .flashcard-ja{opacity:1;transform:translateY(0)}
.flashcard-words{margin-top:16px;text-align:left;opacity:0;transform:translateY(10px);transition:.3s .1s}
.flashcard.revealed .flashcard-words{opacity:1;transform:translateY(0)}
.flashcard-word{display:inline-block;background:var(--card2);border:1px solid var(--border);padding:4px 10px;border-radius:6px;font-size:12px;margin:3px;color:var(--text)}
.flashcard-hint{font-size:12px;color:var(--text2);margin-top:12px}
.flashcard.revealed .flashcard-hint{display:none}
.flashcard-controls{display:flex;gap:12px;width:100%;max-width:500px}
.flashcard-btn{flex:1;padding:14px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.flashcard-btn.again{background:var(--red);color:#fff}
.flashcard-btn.good{background:var(--green);color:#fff}
.flashcard-btn.easy{background:var(--accent);color:#fff}
.flashcard-btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.flashcard-progress{width:100%;max-width:500px;height:4px;background:var(--card);border-radius:2px;overflow:hidden}
.flashcard-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));transition:.3s;border-radius:2px}

/* Quiz mode */
.quiz-container{max-width:600px;margin:0 auto;padding:20px 0}
.quiz-question{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;text-align:center}
.quiz-prompt{font-size:13px;color:var(--text2);margin-bottom:12px}
.quiz-word{font-size:28px;font-weight:700;color:var(--text);margin-bottom:8px}
.quiz-context{font-size:14px;color:var(--text2);line-height:1.5;font-style:italic}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quiz-option{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:16px;font-size:14px;color:var(--text);cursor:pointer;transition:.2s;text-align:center;line-height:1.4}
.quiz-option:hover{border-color:var(--accent);background:var(--card2)}
.quiz-option.correct{border-color:var(--green);background:rgba(0,210,160,.1);color:var(--green)}
.quiz-option.wrong{border-color:var(--red);background:rgba(255,107,107,.1);color:var(--red)}
.quiz-score{text-align:center;padding:20px;font-size:14px;color:var(--text2)}
.quiz-score .big{font-size:48px;font-weight:700;color:var(--gold);display:block;margin:10px 0}

/* TTS button */
.tts-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:6px;transition:.2s;flex-shrink:0}
.tts-btn:hover{background:rgba(74,158,255,.1)}

/* Search */
.search-bar{padding:12px 16px}
.search-input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px;outline:none;transition:.2s}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,158,255,.15)}
.search-input::placeholder{color:var(--text2)}

/* Responsive */
@media(max-width:480px){
  .header h1{font-size:15px}
  .quiz-options{grid-template-columns:1fr}
  .flashcard-en{font-size:17px}
  .stat-card{min-width:80px;padding:8px 10px}
  .stat-card .num{font-size:18px}
}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.pulse{animation:pulse .3s ease}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<div class="header">
  <h1>DUO 3.0<span>単語帳</span></h1>
  <button class="tts-btn" onclick="toggleAutoTTS()" id="autoTTSBtn" title="自動読み上げ">&#128264;</button>
  <button class="header-btn" onclick="resetProgress()" title="リセット">&#8634;</button>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">総単語数</div></div>
  <div class="stat-card"><div class="num" id="statKnown" style="color:var(--green)">0</div><div class="label">覚えた</div></div>
  <div class="stat-card"><div class="num" id="statLearning" style="color:var(--orange)">0</div><div class="label">学習中</div></div>
  <div class="stat-card"><div class="num" id="statNew" style="color:var(--text2)">0</div><div class="label">未学習</div></div>
  <div class="stat-card"><div class="num" id="statPercent" style="color:var(--gold)">0%</div><div class="label">達成率</div></div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="browse" onclick="switchTab('browse')">一覧</div>
  <div class="tab" data-tab="flashcard" onclick="switchTab('flashcard')">フラッシュカード</div>
  <div class="tab" data-tab="quiz" onclick="switchTab('quiz')">クイズ</div>
  <div class="tab" data-tab="search" onclick="switchTab('search')">検索</div>
</div>

<div id="browseView">
  <div class="section-nav" id="sectionNav"></div>
  <div class="content" id="sentenceList"></div>
</div>

<div id="flashcardView" style="display:none">
  <div class="section-nav" id="fcSectionNav"></div>
  <div class="content">
    <div class="flashcard-container" id="flashcardContainer"></div>
  </div>
</div>

<div id="quizView" style="display:none">
  <div class="content">
    <div class="quiz-container" id="quizContainer"></div>
  </div>
</div>

<div id="searchView" style="display:none">
  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="英単語・日本語で検索..." oninput="doSearch(this.value)">
  </div>
  <div class="content" id="searchResults"></div>
</div>

<script src="data.js"></script>
<script>
// State
let currentTab = 'browse';
let currentSection = 0; // 0=all
let wordStatus = {}; // { "word": "known"|"learning"|"new" }
let autoTTS = false;
let fcIndex = 0;
let fcCards = [];
let quizScore = { correct: 0, total: 0 };

// Init
function init() {
  loadProgress();
  renderSectionNav();
  renderBrowse();
  updateStats();
}

// LocalStorage
function loadProgress() {
  try {
    const d = localStorage.getItem('duo30_progress');
    if (d) wordStatus = JSON.parse(d);
  } catch(e) {}
}
function saveProgress() {
  localStorage.setItem('duo30_progress', JSON.stringify(wordStatus));
}
function resetProgress() {
  if (!confirm('進捗をリセットしますか？')) return;
  wordStatus = {};
  saveProgress();
  renderBrowse();
  updateStats();
}

// Stats
function updateStats() {
  let total = 0, known = 0, learning = 0;
  DUO_DATA.forEach(s => s.sentences.forEach(sent => {
    sent.words.forEach(w => {
      total++;
      const st = wordStatus[w.word];
      if (st === 'known') known++;
      else if (st === 'learning') learning++;
    });
  }));
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statKnown').textContent = known;
  document.getElementById('statLearning').textContent = learning;
  document.getElementById('statNew').textContent = total - known - learning;
  document.getElementById('statPercent').textContent = total ? Math.round(known / total * 100) + '%' : '0%';
}

// TTS
function speak(text) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }
}
function toggleAutoTTS() {
  autoTTS = !autoTTS;
  document.getElementById('autoTTSBtn').style.color = autoTTS ? 'var(--green)' : 'var(--accent)';
}

// Tabs
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('browseView').style.display = tab === 'browse' ? '' : 'none';
  document.getElementById('flashcardView').style.display = tab === 'flashcard' ? '' : 'none';
  document.getElementById('quizView').style.display = tab === 'quiz' ? '' : 'none';
  document.getElementById('searchView').style.display = tab === 'search' ? '' : 'none';
  if (tab === 'flashcard') initFlashcards();
  if (tab === 'quiz') initQuiz();
  if (tab === 'search') document.getElementById('searchInput').focus();
}

// Section nav
function renderSectionNav() {
  const targets = ['sectionNav', 'fcSectionNav'];
  targets.forEach(id => {
    const nav = document.getElementById(id);
    if (!nav) return;
    let html = `<button class="section-btn ${currentSection===0?'active':''}" onclick="selectSection(0)">ALL</button>`;
    DUO_DATA.forEach(s => {
      html += `<button class="section-btn ${currentSection===s.section?'active':''}" onclick="selectSection(${s.section})">Sec ${s.section}</button>`;
    });
    nav.innerHTML = html;
  });
}
function selectSection(n) {
  currentSection = n;
  renderSectionNav();
  if (currentTab === 'browse') renderBrowse();
  if (currentTab === 'flashcard') initFlashcards();
}

// Browse view
function renderBrowse() {
  const list = document.getElementById('sentenceList');
  let html = '';
  const sections = currentSection === 0 ? DUO_DATA : DUO_DATA.filter(s => s.section === currentSection);
  sections.forEach(sec => {
    html += `<div style="padding:8px 0 4px;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:1px">SECTION ${sec.section} — ${sec.title}</div>`;
    sec.sentences.forEach(sent => {
      const allKnown = sent.words.every(w => wordStatus[w.word] === 'known');
      html += `<div class="sentence-card ${allKnown?'mastered':''}" id="sent-${sent.id}">
        <div class="sentence-header" onclick="toggleSentence(${sent.id})">
          <div class="sentence-num">${sent.id}</div>
          <div class="sentence-en">${sent.en}</div>
          <button class="tts-btn" onclick="event.stopPropagation();speak('${sent.en.replace(/'/g,"\\'")}')">&#128264;</button>
          <div class="sentence-expand">&#9660;</div>
        </div>
        <div class="sentence-body">
          <div class="sentence-ja">${sent.ja}</div>
          <div class="word-list">
            ${sent.words.map(w => renderWordItem(w)).join('')}
          </div>
        </div>
      </div>`;
    });
  });
  list.innerHTML = html;
}

function renderWordItem(w) {
  const st = wordStatus[w.word] || 'new';
  return `<div class="word-item">
    <div class="word-top">
      <span class="word-en">${w.word}</span>
      ${w.phonetic ? `<span class="word-phonetic">[${w.phonetic}]</span>` : ''}
      <span class="word-pos">${w.pos}</span>
    </div>
    <div class="word-meanings">${w.meanings.map((m,i) => `${w.meanings.length>1?'<span style="color:var(--text2)">'+(i+1)+'. </span>':''}${m}`).join('<br>')}</div>
    ${w.related.length ? `<div class="word-related">${w.related.join(' / ')}</div>` : ''}
    <div class="word-status">
      <button class="word-status-btn ${st==='known'?'known':''}" onclick="event.stopPropagation();setWordStatus('${esc(w.word)}','known')">覚えた</button>
      <button class="word-status-btn ${st==='learning'?'learning':''}" onclick="event.stopPropagation();setWordStatus('${esc(w.word)}','learning')">学習中</button>
    </div>
  </div>`;
}

function esc(s) { return s.replace(/'/g, "\\'").replace(/"/g, '\\"'); }

function toggleSentence(id) {
  const el = document.getElementById('sent-' + id);
  el.classList.toggle('open');
  if (el.classList.contains('open') && autoTTS) {
    const sent = findSentence(id);
    if (sent) speak(sent.en);
  }
}

function findSentence(id) {
  for (const s of DUO_DATA) for (const sent of s.sentences) if (sent.id === id) return sent;
  return null;
}

function setWordStatus(word, status) {
  if (wordStatus[word] === status) {
    delete wordStatus[word];
  } else {
    wordStatus[word] = status;
  }
  saveProgress();
  updateStats();
  renderBrowse();
}

// Flashcard
function initFlashcards() {
  const sections = currentSection === 0 ? DUO_DATA : DUO_DATA.filter(s => s.section === currentSection);
  fcCards = [];
  sections.forEach(s => s.sentences.forEach(sent => fcCards.push(sent)));
  // Shuffle
  for (let i = fcCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [fcCards[i], fcCards[j]] = [fcCards[j], fcCards[i]];
  }
  fcIndex = 0;
  renderFlashcard();
}

function renderFlashcard() {
  const container = document.getElementById('flashcardContainer');
  if (fcIndex >= fcCards.length) {
    container.innerHTML = `<div class="quiz-score fade-in">
      <div class="big">&#127881;</div>
      <div style="font-size:18px;color:var(--text);margin-bottom:10px">全カード完了！</div>
      <button class="header-btn" onclick="initFlashcards()" style="font-size:15px;padding:12px 24px">もう一度</button>
    </div>`;
    return;
  }
  const sent = fcCards[fcIndex];
  const sec = DUO_DATA.find(s => s.sentences.includes(sent));
  container.innerHTML = `
    <div class="flashcard-progress"><div class="flashcard-progress-fill" style="width:${(fcIndex/fcCards.length)*100}%"></div></div>
    <div class="flashcard fade-in" id="flashcard" onclick="revealFlashcard()">
      <div class="flashcard-num">#${sent.id}</div>
      <div class="flashcard-section">Section ${sec ? sec.section : '?'}</div>
      <div class="flashcard-en">${sent.en}</div>
      <div class="flashcard-divider"></div>
      <div class="flashcard-ja">${sent.ja}</div>
      <div class="flashcard-words">
        ${sent.words.map(w => `<span class="flashcard-word"><b>${w.word}</b> ${w.pos} ${w.meanings[0]}</span>`).join('')}
      </div>
      <div class="flashcard-hint">タップして答えを見る</div>
    </div>
    <div class="flashcard-controls" id="fcControls" style="display:none">
      <button class="flashcard-btn again" onclick="fcNext('again')">もう一度</button>
      <button class="flashcard-btn good" onclick="fcNext('good')">覚えた</button>
      <button class="flashcard-btn easy" onclick="fcNext('easy')">簡単</button>
    </div>
    <div style="text-align:center;margin-top:8px">
      <button class="tts-btn" onclick="speak('${sent.en.replace(/'/g,"\\'")}')">&#128264; 読み上げ</button>
      <span style="font-size:12px;color:var(--text2);margin-left:12px">${fcIndex+1} / ${fcCards.length}</span>
    </div>`;
}

function revealFlashcard() {
  const fc = document.getElementById('flashcard');
  if (fc.classList.contains('revealed')) return;
  fc.classList.add('revealed');
  document.getElementById('fcControls').style.display = 'flex';
  if (autoTTS) {
    const sent = fcCards[fcIndex];
    speak(sent.en);
  }
}

function fcNext(action) {
  const sent = fcCards[fcIndex];
  if (action === 'easy') {
    sent.words.forEach(w => { wordStatus[w.word] = 'known'; });
  } else if (action === 'good') {
    sent.words.forEach(w => { if (!wordStatus[w.word]) wordStatus[w.word] = 'learning'; });
  } else if (action === 'again') {
    // Put back later
    if (fcIndex + 3 < fcCards.length) {
      fcCards.splice(fcIndex + 3, 0, sent);
    } else {
      fcCards.push(sent);
    }
  }
  saveProgress();
  updateStats();
  fcIndex++;
  renderFlashcard();
}

// Quiz
function initQuiz() {
  quizScore = { correct: 0, total: 0 };
  renderQuiz();
}

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  // Gather all words
  const allWords = [];
  DUO_DATA.forEach(s => s.sentences.forEach(sent => sent.words.forEach(w => {
    if (w.meanings.length > 0) allWords.push({ ...w, sentEn: sent.en, sentId: sent.id });
  })));
  if (allWords.length < 4) {
    container.innerHTML = '<p style="text-align:center;color:var(--text2)">単語が足りません</p>';
    return;
  }

  // Pick random word
  const idx = Math.floor(Math.random() * allWords.length);
  const target = allWords[idx];

  // Get 3 wrong options
  const wrongPool = allWords.filter((w,i) => i !== idx && w.meanings[0] !== target.meanings[0]);
  const wrongs = [];
  while (wrongs.length < 3 && wrongPool.length > 0) {
    const ri = Math.floor(Math.random() * wrongPool.length);
    wrongs.push(wrongPool.splice(ri, 1)[0]);
  }

  // Shuffle options
  const options = [target, ...wrongs].sort(() => Math.random() - 0.5);

  container.innerHTML = `
    <div class="quiz-question fade-in">
      <div class="quiz-prompt">この単語の意味は？</div>
      <div class="quiz-word">${target.word}</div>
      <div class="quiz-context">"${target.sentEn}"</div>
    </div>
    <div class="quiz-options" id="quizOptions">
      ${options.map((o, i) => `<div class="quiz-option" data-correct="${o.word === target.word}" onclick="checkQuiz(this,'${esc(target.word)}')">${o.meanings[0]}</div>`).join('')}
    </div>
    <div class="quiz-score">正解: ${quizScore.correct} / ${quizScore.total}</div>
    <div style="text-align:center;margin-top:12px">
      <button class="header-btn" onclick="initQuiz()">リセット</button>
    </div>`;
}

function checkQuiz(el, targetWord) {
  if (el.parentElement.dataset.answered) return;
  el.parentElement.dataset.answered = 'true';
  quizScore.total++;

  const isCorrect = el.dataset.correct === 'true';
  if (isCorrect) {
    quizScore.correct++;
    el.classList.add('correct');
    wordStatus[targetWord] = 'known';
  } else {
    el.classList.add('wrong');
    // Show correct
    el.parentElement.querySelectorAll('.quiz-option').forEach(o => {
      if (o.dataset.correct === 'true') o.classList.add('correct');
    });
  }
  saveProgress();
  updateStats();
  setTimeout(() => renderQuiz(), 1200);
}

// Search
function doSearch(query) {
  const results = document.getElementById('searchResults');
  if (!query || query.length < 1) {
    results.innerHTML = '<p style="text-align:center;color:var(--text2);padding:40px">単語を入力してください</p>';
    return;
  }
  const q = query.toLowerCase();
  let html = '';
  let count = 0;
  DUO_DATA.forEach(sec => {
    sec.sentences.forEach(sent => {
      // Search in sentence
      const sentMatch = sent.en.toLowerCase().includes(q) || sent.ja.includes(q);
      // Search in words
      const matchedWords = sent.words.filter(w =>
        w.word.toLowerCase().includes(q) ||
        w.meanings.some(m => m.includes(q)) ||
        (w.phonetic && w.phonetic.includes(q))
      );
      if (sentMatch || matchedWords.length > 0) {
        count++;
        const highlight = (text) => text.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark style="background:var(--accent);color:#fff;padding:0 2px;border-radius:2px">$1</mark>');
        html += `<div class="sentence-card" id="search-${sent.id}">
          <div class="sentence-header" onclick="toggleSentence2('search-${sent.id}')">
            <div class="sentence-num">${sent.id}</div>
            <div class="sentence-en">${highlight(sent.en)}</div>
            <div class="sentence-expand">&#9660;</div>
          </div>
          <div class="sentence-body">
            <div class="sentence-ja">${sent.ja}</div>
            <div class="word-list">
              ${(matchedWords.length > 0 ? matchedWords : sent.words).map(w => renderWordItem(w)).join('')}
            </div>
          </div>
        </div>`;
      }
    });
  });
  results.innerHTML = html || '<p style="text-align:center;color:var(--text2);padding:40px">見つかりません</p>';
  if (count > 0) results.innerHTML = `<p style="font-size:12px;color:var(--text2);margin-bottom:8px">${count}件見つかりました</p>` + results.innerHTML;
}

function toggleSentence2(id) {
  document.getElementById(id).classList.toggle('open');
}

// Keyboard
document.addEventListener('keydown', e => {
  if (currentTab === 'flashcard') {
    if (e.code === 'Space') { e.preventDefault(); revealFlashcard(); }
    if (e.code === 'Digit1' || e.code === 'ArrowLeft') fcNext('again');
    if (e.code === 'Digit2' || e.code === 'ArrowDown') fcNext('good');
    if (e.code === 'Digit3' || e.code === 'ArrowRight') fcNext('easy');
  }
});

// Swipe support for flashcards
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  if (currentTab !== 'flashcard') return;
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) > 80) {
    const fc = document.getElementById('flashcard');
    if (fc && fc.classList.contains('revealed')) {
      if (diff > 0) fcNext('good');
      else fcNext('again');
    }
  }
});

init();
</script>
